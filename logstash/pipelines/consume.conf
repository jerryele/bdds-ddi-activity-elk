# Kafka -> flatten -> Elasticsearch.  Raw nested fields are kept; flat fields are added alongside.
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["activity-dns", "activity-dhcp", "statistics-dns", "statistics-dhcp"]
    group_id => "logstash-es"
    codec => json
    decorate_events => "basic"
    metadata_max_age_ms => 30000
  }
}
filter {
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" tag_on_failure => ["_dateparsefailure"] }
  mutate {
    remove_field => ["[event][original]", "@version"]
    add_field => { "[@metadata][index]" => "%{[@metadata][kafka][topic]}" "[event][dataset]" => "%{[@metadata][kafka][topic]}" }
  }

  # ---------------- DNS activity (dnstap) ----------------
  if [@metadata][kafka][topic] == "activity-dns" {
    ruby {
      code => '
        rc = {0=>"NoError",1=>"FormErr",2=>"ServFail",3=>"NXDomain",4=>"NotImp",5=>"Refused",6=>"YXDomain",7=>"YXRRSet",8=>"NXRRSet",9=>"NotAuth",10=>"NotZone",16=>"BADVERS",23=>"BADCOOKIE"}
        mt = event.get("messageType").to_s
        event.set("[dns][message_type]", mt)
        event.set("[dns][direction]", mt.end_with?("Response") ? "response" : "query")
        stage = mt.sub(/(Query|Response)$/, "")
        event.set("[dns][stage]", stage)
        src = event.get("sourceAddress"); dst = event.get("responseAddress")
        event.set("[source][ip]", src) if src
        event.set("[source][port]", event.get("sourcePort")) if event.get("sourcePort")
        event.set("[destination][ip]", dst) if dst
        event.set("[destination][port]", event.get("responsePort")) if event.get("responsePort")
        if stage == "Client"
          event.set("[dns][client_ip]", src) if src
        elsif dst
          event.set("[dns][upstream_ip]", dst)
        end
        event.set("[dns][protocol]", event.get("socketProtocol")) if event.get("socketProtocol")
        event.set("[dns][server_id]", event.get("serverId")) if event.get("serverId")

        rq = event.get("requestData") || {}
        rs = event.get("responseData") || {}
        hdr = (rs["header"] || rq["header"]) || {}
        q = ((rs["question"] || rq["question"]) || [])[0]
        answers = rs["answers"] || []
        qname = q ? q["domainName"] : (answers[0] ? answers[0]["domainName"] : nil)
        event.set("[dns][qname]", qname.to_s.downcase.chomp(".")) if qname
        if q
          event.set("[dns][qtype]", q["questionType"]); event.set("[dns][qclass]", q["class"])
        elsif answers[0]
          event.set("[dns][qtype]", answers[0]["recordType"])
        end
        event.set("[dns][id]", hdr["id"]) if hdr["id"]
        event.set("[dns][opcode]", hdr["opcode"]) if hdr.key?("opcode")
        %w[rd ra aa tc ad cd].each { |f| event.set("[dns][flags][#{f}]", hdr[f]) if hdr.key?(f) }
        if mt.end_with?("Response")
          if hdr.key?("rcode") || rs["rcodeName"]
            event.set("[dns][rcode_id]", hdr["rcode"]) if hdr.key?("rcode")
            event.set("[dns][rcode]", rs["rcodeName"] || rc[hdr["rcode"]] || hdr["rcode"].to_s)
          end
          event.set("[dns][answer_count]", answers.size)
          if answers.any?
            event.set("[dns][answers]", answers.map { |a| a["rData"].to_s }.uniq)
            event.set("[dns][answer_types]", answers.map { |a| a["recordType"].to_s }.uniq)
            ips = answers.select { |a| %w[A AAAA].include?(a["recordType"]) }.map { |a| a["rData"] }
            event.set("[dns][resolved_ips]", ips.uniq) if ips.any?
            ttls = answers.map { |a| a["ttl"] }.compact
            event.set("[dns][min_ttl]", ttls.min) if ttls.any?
          end
          t0 = rq["time"]; t1 = event.get("time")
          if t0.is_a?(Numeric) && t1.is_a?(Numeric) && t1 >= t0
            event.set("[dns][latency_ms]", ((t1 - t0) / 1_000_000.0).round(3))
          end
        end
      '
      tag_on_exception => "_dns_flatten_failure"
    }
    # raw nested payload and top-level duplicates of the flat fields above
    mutate {
      remove_field => ["requestData", "responseData", "sourceAddress", "sourcePort", "responseAddress", "responsePort",
                       "messageType", "messageTypeId", "socketProtocol", "socketFamily", "dataType", "dataTypeId",
                       "time", "timePrecision", "timestamp", "source_type", "schemaVersion"]
    }
  }

  # ---------------- DHCP activity ----------------
  if [@metadata][kafka][topic] == "activity-dhcp" {
    ruby {
      code => '
        pt = event.get("payloadType").to_s
        event.set("[dhcp][server_id]", event.get("serverId")) if event.get("serverId")
        hex2s = lambda { |h| h.to_s.split(" ").map { |x| x.to_i(16) }.pack("C*").force_encoding("UTF-8").scrub("?") }
        if pt == "dhcpv4-packet"
          m = event.get("[data][dhcpv4Message]") || {}
          o = {}
          (m["options"] || []).each { |x| o[x["optionId"]] = x }
          event.set("[dhcp][version]", 4)
          mtp = o[53] && o[53]["messageType"]
          event.set("[dhcp][message_type]", mtp.to_s.sub(/^DHCP /, "")) if mtp
          event.set("[dhcp][client_mac]", m["chaddr"]) if m["chaddr"]
          {"ciaddr"=>"client_ip","yiaddr"=>"your_ip","siaddr"=>"server_ip","giaddr"=>"relay_ip"}.each do |k, f|
            event.set("[dhcp][#{f}]", m[k]) if m[k]
          end
          event.set("[dhcp][xid]", m["xId"]) if m["xId"]
          event.set("[dhcp][hostname]", o[12]["hostName"]) if o[12]
          event.set("[dhcp][requested_ip]", o[50]["requestedAddr"]) if o[50]
          event.set("[dhcp][lease_time]", o[51]["leaseTime"]) if o[51]
          event.set("[dhcp][server_identifier]", o[54]["serverId"]) if o[54]
          event.set("[dhcp][subnet_mask]", o[1]["subnetMask"]) if o[1]
          event.set("[dhcp][router]", o[3]["router"]) if o[3]
          event.set("[dhcp][dns_servers]", o[6]["domainNameSever"]) if o[6]
          event.set("[dhcp][vendor_class]", hex2s.call(o[60]["optionData"])) if o[60] && o[60]["optionData"]
          event.set("[dhcp][client_id]", o[61]["clientId"]) if o[61]
          event.set("[dhcp][param_request_list]", o[55]["parameterRequest"]) if o[55]
          event.set("[dhcp][message]", hex2s.call(o[56]["optionData"])) if o[56] && o[56]["optionData"]
        elsif pt == "dhcpv6-packet"
          m = event.get("[data][dhcpv6Message]") || {}
          o = {}
          (m["options"] || []).each { |x| o[x["optionId"]] = x }
          event.set("[dhcp][version]", 6)
          event.set("[dhcp][message_type]", m["messageType"]) if m["messageType"]
          event.set("[dhcp][xid]", m["transactionId"]) if m["transactionId"]
          event.set("[dhcp][client_duid]", o[1]["duid"]) if o[1]
          event.set("[dhcp][server_duid]", o[2]["duid"]) if o[2]
          ia = o[3] ? (o[3]["iaNaOptions"] || []) : []
          addrs = ia.map { |a| a["ipv6Addr"] }.compact
          event.set("[dhcp][ia_addrs]", addrs) if addrs.any?
          event.set("[dhcp][lease_time]", ia[0]["validLifetime"]) if ia[0] && ia[0]["validLifetime"]
          event.set("[dhcp][dns_servers]", o[23]["dnsServers"]) if o[23]
          event.set("[dhcp][search_list]", o[24]["searchList"]) if o[24]
        end
      '
      tag_on_exception => "_dhcp_flatten_failure"
    }
    # raw nested packet and top-level duplicates of the flat fields above
    mutate { remove_field => ["data", "time", "timePrecision", "timestamp", "schemaVersion"] }
  }

  # ---------------- DNS statistics ----------------
  if [@metadata][kafka][topic] == "statistics-dns" {
    # per-memory-context detail: random addresses, no analytic value
    mutate { remove_field => ["[data][memory][contexts]"] }
  }

  # ---------------- DHCP statistics: topClients -> one document per client ----------------
  if [@metadata][kafka][topic] == "statistics-dhcp" {
    ruby {
      code => '
        top = event.get("[data][topClients]")
        if top.is_a?(Array)
          top.each_with_index do |c, i|
            ne = LogStash::Event.new(
              "@timestamp" => event.get("@timestamp"),
              "serverId" => event.get("serverId"),
              "payloadType" => event.get("payloadType").to_s + "-topclient",
              "top_client" => { "id" => c["id"], "type" => c["key"], "count" => c["count"], "rank" => i + 1 },
              "event" => { "dataset" => "statistics-topclients-dhcp" }
            )
            ne.set("[@metadata][index]", "statistics-topclients-dhcp")
            new_event_block.call(ne)
          end
          event.remove("[data][topClients]")
        end
      '
      tag_on_exception => "_dhcpstats_flatten_failure"
    }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
